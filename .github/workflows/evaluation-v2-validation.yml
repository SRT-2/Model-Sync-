name: Evaluation V2 Offline Validation

on:
  push:
    branches:
      - evaluation-v2-preparation
  pull_request:
    branches:
      - evaluation-v2-preparation

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline test suite
        run: |
          mkdir -p testing-results/preflight
          python -m pytest tests/test_evaluation_v2.py tests/test_router.py -v --tb=short --junitxml=testing-results/preflight/pytest-junit.xml
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-v2-offline-validation
          path: testing-results/preflight/pytest-junit.xml
          if-no-files-found: ignore
